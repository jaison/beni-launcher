name: Release

# Os notebooks se atualizam sozinhos pelas Releases (beni/sistema/beni-atualizar):
# eles baixam o pacote da própria tag, então aqui não há nada para publicar.
# Este workflow só confere se a tag está pronta para chegar às crianças.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check:
    name: Conferir a release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: A tag bate com o VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(tr -d ' \n' < VERSION)"
          echo "tag=$tag VERSION=$version"
          if [[ "$tag" != "$version" ]]; then
            echo "::error::A tag v$tag não bate com o VERSION ($version); os notebooks vão recusar este pacote."
            exit 1
          fi

      - name: Arquivos que o atualizador exige
        run: |
          for f in instalar.sh VERSION src/server.py beni/sistema/instalar-sistema.sh beni/sistema/beni-atualizar beni/config/migracoes.json; do
            test -e "$f" || { echo "::error::falta $f"; exit 1; }
          done
          bash -n instalar.sh beni/sistema/instalar-sistema.sh
          python3 -c "import json; json.load(open('beni/config/migracoes.json'))"

      - name: Testes
        run: python -m unittest discover -s tests
