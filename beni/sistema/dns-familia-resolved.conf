# DNS com filtro para crianças (CleanBrowsing Family), em qualquer rede.
# Bloqueia sites adultos, proxies e VPNs e força a Busca Segura (Google/Bing)
# e o Modo Restrito do YouTube.
# Instalado em /etc/systemd/resolved.conf.d/ pelo instalar.sh.
[Resolve]
DNS=185.228.168.168 185.228.169.168 2a0d:2a00:1:: 2a0d:2a00:2::
# sem DNS reserva (o padrão seria Google/Cloudflare, sem filtro)
FallbackDNS=
Domains=~.
