# DNS com filtro para crianças: o NetworkManager NÃO repassa o DNS do roteador
# (de nenhuma rede). Quem resolve nomes é o systemd-resolved, com o DNS do
# arquivo dns-familia-resolved.conf (CleanBrowsing Family).
# Instalado em /etc/NetworkManager/conf.d/ pelo instalar.sh.
# Para desligar: apague este arquivo e /etc/systemd/resolved.conf.d/dns-familia.conf
# e rode: sudo systemctl restart systemd-resolved NetworkManager
[main]
dns=none
