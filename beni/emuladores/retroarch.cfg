# Configuração do RetroArch usada só pelo "Cozy Jogos" (Super Nintendo).
# Carregada com: retroarch -c ~/.config/cozy-jogos/retroarch.cfg
# Pensada para notebook fraco (Celeron B800 + Intel HD 2000) e criança de 8 anos.
config_save_on_exit = "false"

# --- Vídeo: tela cheia "borderless" na resolução nativa (NUNCA troca o modo) ---
video_driver = "gl"
video_fullscreen = "true"
video_windowed_fullscreen = "true"
video_fullscreen_x = "0"
video_fullscreen_y = "0"
video_vsync = "true"
video_threaded = "true"
video_smooth = "false"
video_scale_integer = "false"
aspect_ratio_index = "0"
video_shader_enable = "false"
video_font_enable = "false"
video_disable_composition = "false"
suspend_screensaver_enable = "true"
pause_nonactive = "false"

# --- Áudio leve ---
audio_driver = "pulse"
audio_enable = "true"
audio_latency = "96"
audio_sync = "true"
audio_resampler = "nearest"
audio_resampler_quality = "1"

# --- Menu: escondido. A criança não deve cair no menu do RetroArch ---
menu_driver = "rgui"
kiosk_mode_enable = "true"
input_menu_toggle = "nul"
input_menu_toggle_btn = "nul"
input_menu_toggle_gamepad_combo = "0"
menu_show_online_updater = "false"
menu_show_core_updater = "false"
rgui_show_start_screen = "false"
notification_show_autoconfig = "false"
notification_show_remap_load = "false"
notification_show_config_override_load = "false"
notification_show_save_state = "false"
notification_show_fast_forward = "false"
menu_enable_widgets = "false"

# --- Sair do jogo: Esc no teclado, ou Start+Select no controle ---
quit_press_twice = "false"
input_exit_emulator = "escape"
input_quit_gamepad_combo = "4"

# --- Não prender o mouse (o botão X do launcher precisa continuar funcionando) ---
input_grab_mouse_toggle = "nul"
input_auto_mouse_grab = "false"
input_auto_game_focus = "0"
input_game_focus_toggle = "nul"

# --- Teclas de atalho que a criança poderia apertar sem querer: desligadas ---
input_toggle_fullscreen = "nul"
input_pause_toggle = "nul"
input_frame_advance = "nul"
input_hold_fast_forward = "nul"
input_toggle_fast_forward = "nul"
input_hold_slowmotion = "nul"
input_toggle_slowmotion = "nul"
input_rewind = "nul"
input_reset = "nul"
input_shader_next = "nul"
input_shader_prev = "nul"
input_shader_toggle = "nul"
input_cheat_index_plus = "nul"
input_cheat_index_minus = "nul"
input_cheat_toggle = "nul"
input_screenshot = "nul"
input_audio_mute = "nul"
input_osk_toggle = "nul"
input_netplay_game_watch = "nul"
input_netplay_ping_toggle = "nul"
input_save_state = "nul"
input_load_state = "nul"
input_state_slot_increase = "nul"
input_state_slot_decrease = "nul"
input_volume_up = "nul"
input_volume_down = "nul"
input_movie_record_toggle = "nul"
input_recording_toggle = "nul"
input_streaming_toggle = "nul"
input_desktop_menu_toggle = "nul"
input_ai_service = "nul"
input_fps_toggle = "nul"
input_send_debug_info = "nul"
input_close_content = "nul"
input_disk_eject_toggle = "nul"
input_disk_next = "nul"
input_disk_prev = "nul"
input_runahead_toggle = "nul"
input_preempt_toggle = "nul"
input_record_replay = "nul"
input_play_replay = "nul"
input_halt_replay = "nul"
input_replay_slot_increase = "nul"
input_replay_slot_decrease = "nul"
input_overlay_next = "nul"
input_toggle_statistics = "nul"
input_toggle_vrr_runloop = "nul"
input_turbo_fire_toggle = "nul"

# --- Teclado do jogador 1 (padrão do RetroArch) ---
# Setas = direcional | X = A | Z = B | S = X | A = Y | Q/W = L/R
# Enter = Start | Shift direito = Select
input_driver = "x"
input_player1_up = "up"
input_player1_down = "down"
input_player1_left = "left"
input_player1_right = "right"
input_player1_a = "x"
input_player1_b = "z"
input_player1_x = "s"
input_player1_y = "a"
input_player1_l = "q"
input_player1_r = "w"
input_player1_start = "enter"
input_player1_select = "rshift"

# --- Controle (gamepad) ---
# Se o RetroArch reconhecer o controle (autoconfig), usa o perfil dele.
# Senão, vale este mapeamento genérico estilo Xbox/XInput (driver xpad do Linux):
# A(0)=B do SNES, B(1)=A, X(2)=Y, Y(3)=X, LB(4)=L, RB(5)=R, Back(6)=Select, Start(7)=Start
joypad_driver = "udev"
input_autodetect_enable = "true"
input_player1_joypad_index = "0"
input_player1_analog_dpad_mode = "1"
input_player1_b_btn = "0"
input_player1_a_btn = "1"
input_player1_y_btn = "2"
input_player1_x_btn = "3"
input_player1_l_btn = "4"
input_player1_r_btn = "5"
input_player1_select_btn = "6"
input_player1_start_btn = "7"
input_player1_up_btn = "h0up"
input_player1_down_btn = "h0down"
input_player1_left_btn = "h0left"
input_player1_right_btn = "h0right"
input_player1_l_x_plus_axis = "+0"
input_player1_l_x_minus_axis = "-0"
input_player1_l_y_plus_axis = "+1"
input_player1_l_y_minus_axis = "-1"

# --- Saves (o progresso do cartucho é salvo automaticamente) ---
savefile_directory = "~/Jogos/.saves/snes"
savestate_directory = "~/Jogos/.saves/snes"
sort_savefiles_enable = "false"
autosave_interval = "20"
savestate_auto_save = "false"
savestate_auto_load = "false"
rewind_enable = "false"
run_ahead_enabled = "false"
cache_directory = "/tmp"
system_directory = "~/Jogos/.saves/system"
log_verbosity = "false"
